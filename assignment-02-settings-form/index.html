<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Settings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="settings-page">
      <header class="settings-header">
        <h1>Account Settings</h1>
        <p>Update your profile and preferences. Fields marked with <span class="required-mark">*</span> are required.</p>
      </header>

      <form id="settings-form" class="settings-form" novalidate>
        <section class="form-section" aria-labelledby="profile-heading">
          <h2 id="profile-heading">Profile</h2>

          <div class="form-group">
            <label for="display-name">Display name <span class="required-mark">*</span></label>
            <input
              type="text"
              id="display-name"
              name="displayName"
              autocomplete="name"
              required
              minlength="2"
              maxlength="50"
              placeholder="Jane Doe"
            />
            <p class="error-message" id="display-name-error" role="alert"></p>
          </div>

          <div class="form-group">
            <label for="email">Email address <span class="required-mark">*</span></label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              required
              placeholder="jane@example.com"
            />
            <p class="error-message" id="email-error" role="alert"></p>
          </div>

          <div class="form-group">
            <label for="username">Username <span class="required-mark">*</span></label>
            <input
              type="text"
              id="username"
              name="username"
              autocomplete="username"
              required
              minlength="3"
              maxlength="20"
              placeholder="jane_doe"
            />
            <p class="hint">3–20 characters. Letters, numbers, and underscores only.</p>
            <p class="error-message" id="username-error" role="alert"></p>
          </div>

          <div class="form-group">
            <label for="bio">Bio</label>
            <textarea
              id="bio"
              name="bio"
              rows="4"
              maxlength="200"
              placeholder="Tell us a little about yourself…"
            ></textarea>
            <p class="hint"><span id="bio-count">0</span> / 200 characters</p>
            <p class="error-message" id="bio-error" role="alert"></p>
          </div>
        </section>

        <section class="form-section" aria-labelledby="contact-heading">
          <h2 id="contact-heading">Contact</h2>

          <div class="form-row">
            <div class="form-group">
              <label for="phone">Phone number</label>
              <input
                type="tel"
                id="phone"
                name="phone"
                autocomplete="tel"
                placeholder="+1 (555) 123-4567"
              />
              <p class="error-message" id="phone-error" role="alert"></p>
            </div>

            <div class="form-group">
              <label for="website">Website</label>
              <input
                type="url"
                id="website"
                name="website"
                autocomplete="url"
                placeholder="https://example.com"
              />
              <p class="error-message" id="website-error" role="alert"></p>
            </div>
          </div>
        </section>

        <section class="form-section" aria-labelledby="security-heading">
          <h2 id="security-heading">Security</h2>

          <div class="form-row">
            <div class="form-group">
              <label for="password">New password</label>
              <input
                type="password"
                id="password"
                name="password"
                autocomplete="new-password"
                minlength="8"
                placeholder="Leave blank to keep current"
              />
              <p class="hint">At least 8 characters with uppercase, lowercase, and a number.</p>
              <p class="error-message" id="password-error" role="alert"></p>
            </div>

            <div class="form-group">
              <label for="confirm-password">Confirm password</label>
              <input
                type="password"
                id="confirm-password"
                name="confirmPassword"
                autocomplete="new-password"
                placeholder="Re-enter new password"
              />
              <p class="error-message" id="confirm-password-error" role="alert"></p>
            </div>
          </div>
        </section>

        <section class="form-section" aria-labelledby="preferences-heading">
          <h2 id="preferences-heading">Preferences</h2>

          <div class="form-row">
            <div class="form-group">
              <label for="theme">Theme <span class="required-mark">*</span></label>
              <select id="theme" name="theme" required>
                <option value="">Select a theme</option>
                <option value="light">Light</option>
                <option value="dark">Dark</option>
                <option value="system">System default</option>
              </select>
              <p class="error-message" id="theme-error" role="alert"></p>
            </div>

            <div class="form-group">
              <label for="language">Language</label>
              <select id="language" name="language">
                <option value="en">English</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
              </select>
            </div>
          </div>

          <fieldset class="form-group checkbox-group">
            <legend>Email notifications</legend>
            <label class="checkbox-label">
              <input type="checkbox" name="notifications" value="product" />
              Product updates
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="notifications" value="security" />
              Security alerts
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="notifications" value="marketing" />
              Marketing emails
            </label>
          </fieldset>
        </section>

        <div class="form-actions">
          <button type="reset" class="btn btn-secondary">Reset</button>
          <button type="submit" class="btn btn-primary">Save changes</button>
        </div>

        <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
      </form>
    </main>

    <script src="script.js"></script>
  </body>
</html>
